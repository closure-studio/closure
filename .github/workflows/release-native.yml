name: Release native

# Push a `v<expo.version>` tag: build a production Android APK on EAS and
# publish it as a GitHub Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-native
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  build:
    name: Android APK
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Check tag matches app version
        run: |
          expected="v$(node -p 'require("./app.json").expo.version')"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app.json version ($expected)"
            exit 1
          fi

      - name: Set up EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build on EAS
        run: |
          eas build --platform android --profile production --non-interactive --wait --json \
            > "$RUNNER_TEMP/build.json"
          url="$(jq -r '.[0].artifacts.buildUrl' "$RUNNER_TEMP/build.json")"
          curl --fail --location --silent --show-error --output "closure-$GITHUB_REF_NAME.apk" "$url"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "closure-$GITHUB_REF_NAME.apk" \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
